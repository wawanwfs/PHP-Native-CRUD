name: Cloudflare Tunnel Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: userpassword
      DB_NAME: crud-php-native
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: crud-php-native
          MYSQL_USER: user
          MYSQL_PASSWORD: userpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uuser -puserpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Prepare web root
        run: |
          mkdir -p /tmp/webroot
          if ! compgen -G "*.php" > /dev/null; then
            echo "No PHP files found in repository root."
            exit 1
          fi
          cp *.php /tmp/webroot/

      - name: Wait for MySQL and initialize schema
        run: |
          MAX_RETRIES=30
          RETRY_SLEEP_SECONDS=2

          for ((i=1; i<=MAX_RETRIES; i++)); do
            php -r '
              mysqli_report(MYSQLI_REPORT_OFF);
              $conn = new mysqli(getenv("DB_HOST"), getenv("DB_USER"), getenv("DB_PASSWORD"), getenv("DB_NAME"), (int)getenv("DB_PORT"));
              if ($conn->connect_error) { exit(1); }
              $conn->query("CREATE TABLE IF NOT EXISTS users (id INT AUTO_INCREMENT PRIMARY KEY, username VARCHAR(100) NOT NULL UNIQUE, password VARCHAR(255) NOT NULL, status TINYINT(1) NOT NULL DEFAULT 1)");
              exit(0);
            ' && exit 0
            sleep "$RETRY_SLEEP_SECONDS"
          done

          echo "MySQL is not ready."
          exit 1

      - name: Start PHP built-in server
        run: |
          MAX_RETRIES=10
          RETRY_SLEEP_SECONDS=1

          php -S 127.0.0.1:8000 -t /tmp/webroot > /tmp/php-server.log 2>&1 &
          for ((i=1; i<=MAX_RETRIES; i++)); do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 || true)
            if [ "$STATUS_CODE" = "200" ]; then
              exit 0
            fi
            sleep "$RETRY_SLEEP_SECONDS"
          done
          echo "PHP server failed to start."
          cat /tmp/php-server.log
          exit 1

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Tunnel
        run: cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate > /tmp/cloudflared.log 2>&1 &

      - name: Show public URL
        run: |
          MAX_RETRIES=30
          RETRY_SLEEP_SECONDS=2

          for ((i=1; i<=MAX_RETRIES; i++)); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              echo "Cloudflare URL: $URL"
              exit 0
            fi
            sleep "$RETRY_SLEEP_SECONDS"
          done

          echo "Failed to read Cloudflare URL from log."
          cat /tmp/cloudflared.log
          exit 1

      - name: Keep tunnel alive for 6 hours
        run: sleep 21600
